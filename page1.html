<!DOCTYPE html>
<html>
<head>
    <title>Angry Birds UI</title>
    <link rel="stylesheet" href="page1.css">
</head>

<body>

<div class="main">

    <div class="left-section">

        <div class="header">
            <div class="level">Level 1 (0/10)</div>
            <a href="page2_nickname.html" class="nickname">Nickname</a>
        </div>

        <div class="player-name">
            Player: Guest
        </div>

        <div class="content">

            <div class="sidebar">
                <div class="box">💎 70</div>
                <div class="box">🪙 90</div>
                <div class="box">Hat Shop</div>
            </div>

            <div class="cards">

                <div class="card">
                    <img src="IMG/RED ANGRY BIRD.png">
                    <p>Bird 1</p>
                </div>

                <div class="card">
                    <img src="IMG/BLUE ANGRY BIRD.png">
                    <p>Bird 2</p>
                    <div class="lock">🔒</div>
                </div>

                <div class="card">
                    <img src="IMG/YELLLOW ANGRY BIRD.png">
                    <p>Bird 3</p>
                    <div class="lock">🔒</div>
                </div>

                <div class="card">
                    <img src="IMG/BLACK ANGRY BIRD.png">
                    <p>Bird 4</p>
                    <div class="lock">🔒</div>
                </div>

            </div>

        </div>

        <div class="speech">
            Find the next bird key at level 1
        </div>

    </div>

    <div class="right-panel">
        <h3>Game Levels</h3>

        <div class="level-box">
            <a href="page2.html">Level 1 ✅ Unlocked</a>
        </div>

        <div class="level-box locked">
            Level 2 🔒 Unlocks at 19
        </div>

        <div class="level-box locked">
            Level 3 🔒 Unlocks at 29
        </div>

        <div class="level-box locked">
            Level 4 🔒 Unlocks at 39
        </div>

    </div>
 
</div>
    <div class="level-box">
        <a href="about:blank" class="exit-btn">EXIT GAME</a>
    </div>

</body>
</html>
